name: Acceptance Gmail Credentials Preflight
run-name: Acceptance Gmail credentials only · ${{ github.sha }}
on:
  push:
    branches: [codex/production-admin-auth]
    paths: [.github/workflows/acceptance-gmail-credentials.yml]
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact reviewed commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: acceptance-gmail-credentials
  cancel-in-progress: false
jobs:
  credentials:
    if: github.ref_name == 'codex/production-admin-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: acceptance
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          REQUESTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.tested_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          test "$REQUESTED_SHA" = "$RUN_SHA"
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Verify mocked credential failure and privacy contracts
        run: node scripts/acceptanceGmailCredentialsPreflight.test.mjs
      - name: Verify credential refresh and exact mailbox only
        env:
          APP_ENV: acceptance
          ACCEPTANCE_TEST_MODE: "true"
          ACCEPTANCE_REGISTRATION_CAPTURE_EMAIL: vjvjan.le@gmail.com
          ACCEPTANCE_GMAIL_CLIENT_ID: ${{ secrets.ACCEPTANCE_GMAIL_CLIENT_ID }}
          ACCEPTANCE_GMAIL_CLIENT_SECRET: ${{ secrets.ACCEPTANCE_GMAIL_CLIENT_SECRET }}
          ACCEPTANCE_GMAIL_REFRESH_TOKEN: ${{ secrets.ACCEPTANCE_GMAIL_REFRESH_TOKEN }}
        run: node scripts/acceptanceGmailCredentialsPreflight.mjs
