name: GitHub Actions Immutable Reference CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-pinning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-sha-enforcement:
    name: Reject mutable action references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Verify every workflow action uses an immutable reference
        run: npm run test:github-actions-pinning
