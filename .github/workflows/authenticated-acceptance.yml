name: Production Trust Authenticated Acceptance

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact deployed commit SHA to verify
        required: true
        type: string
      external_mode:
        description: Acceptance launch scope
        required: true
        type: choice
        options: [required, disabled]

permissions:
  contents: read

concurrency:
  group: production-trust-acceptance-environment
  cancel-in-progress: false

jobs:
  authenticated-acceptance:
    if: startsWith(github.ref_name, 'codex/authenticated-acceptance-')
    name: Exact-build authenticated acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: acceptance
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      ACCEPTANCE_TEST_MODE: "true"
      APP_ENV: acceptance
      ACCEPTANCE_DEPLOYMENT_PROTECTION_REQUIRED: "true"
      ACCEPTANCE_EXTERNAL_MODE: ${{ inputs.external_mode }}
      ACCEPTANCE_BASE_URL: ${{ secrets.ACCEPTANCE_BASE_URL }}
      ACCEPTANCE_DEPLOYMENT_BYPASS_SECRET: ${{ secrets.ACCEPTANCE_DEPLOYMENT_BYPASS_SECRET }}
      ACCEPTANCE_EXPECTED_SHA: ${{ inputs.tested_sha }}
      ACCEPTANCE_SUPABASE_URL: ${{ secrets.ACCEPTANCE_SUPABASE_URL }}
      ACCEPTANCE_SUPABASE_ANON_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_ANON_KEY }}
      ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
      ACCEPTANCE_SUPABASE_PROJECT_REF: ${{ secrets.ACCEPTANCE_SUPABASE_PROJECT_REF }}
      ACCEPTANCE_SUPABASE_PROJECT_REF_ALLOWLIST: ${{ secrets.ACCEPTANCE_SUPABASE_PROJECT_REF_ALLOWLIST }}
      ACCEPTANCE_PRODUCTION_PROJECT_REF_DENYLIST: ${{ secrets.ACCEPTANCE_PRODUCTION_PROJECT_REF_DENYLIST }}
      ACCEPTANCE_ENVIRONMENT_ID: ${{ secrets.ACCEPTANCE_ENVIRONMENT_ID }}
      ACCEPTANCE_INTERNAL_SEARCH_QUERY: PTF Synthetic Tester
      ACCEPTANCE_SYNTHETIC_CANDIDATE_MARKER: PTF Synthetic Tester
      ACCEPTANCE_EXTERNAL_SEARCH_QUERY: ${{ secrets.ACCEPTANCE_EXTERNAL_SEARCH_QUERY }}
      ACCEPTANCE_EXTERNAL_PROVIDER_APPROVED: ${{ secrets.ACCEPTANCE_EXTERNAL_PROVIDER_APPROVED }}
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checked-out revision and HTTPS target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.tested_sha }}" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$ACCEPTANCE_EXPECTED_SHA"
          case "$ACCEPTANCE_BASE_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Clean dependency installation
        run: npm ci
      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify durable recruiter storage contracts
        run: npm run test:recruiter-runtime-storage
      - name: Create run-owned acceptance metadata
        shell: bash
        run: |
          set -euo pipefail
          run_id="ptf1c2-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expires_at="$(date -u -d '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "ACCEPTANCE_RUN_ID=$run_id"
            echo "ACCEPTANCE_SYNTHETIC_NAMESPACE=ptf1c2/$run_id"
            echo "ACCEPTANCE_CLEANUP_OWNER=github-actions"
            echo "ACCEPTANCE_EXPIRES_AT=$expires_at"
            echo "ACCEPTANCE_CREDENTIAL_BUNDLE_PATH=$RUNNER_TEMP/acceptance-credentials.json"
          } >> "$GITHUB_ENV"
      - name: Verify protected exact-SHA application release
        run: npm run acceptance:release:preflight
      - name: Verify fail-closed environment and database marker
        run: npm run acceptance:environment:verify
      - name: Verify fixed fixture namespace is available
        run: npm run acceptance:synthetic:availability
      - name: Arm fixture cleanup
        shell: bash
        run: echo "ACCEPTANCE_FIXTURE_CLEANUP_ARMED=true" >> "$GITHUB_ENV"
      - name: Install run-owned synthetic candidate and index
        run: npm run acceptance:synthetic:install
      - name: Verify synthetic candidate through canonical search pipeline
        run: npm run acceptance:synthetic:verify
      - name: Arm identity and mutation cleanup
        shell: bash
        run: echo "ACCEPTANCE_IDENTITY_CLEANUP_ARMED=true" >> "$GITHUB_ENV"
      - name: Provision controlled synthetic identities
        run: npm run acceptance:provision
      - name: Run authenticated browser and API acceptance
        run: npm run acceptance:e2e
      - name: Generate pre-cleanup sanitized evidence
        if: always()
        run: npm run acceptance:report:initial
      - name: Clean identities and controlled mutations
        if: always() && env.ACCEPTANCE_IDENTITY_CLEANUP_ARMED == 'true'
        run: npm run acceptance:cleanup
      - name: Verify identity and mutation cleanup
        if: always() && env.ACCEPTANCE_IDENTITY_CLEANUP_ARMED == 'true'
        run: npm run acceptance:cleanup:verify
      - name: Remove candidate search index, registry lease and candidate
        if: always() && env.ACCEPTANCE_FIXTURE_CLEANUP_ARMED == 'true'
        run: npm run acceptance:synthetic:remove
      - name: Verify zero per-run residue
        if: always() && env.ACCEPTANCE_FIXTURE_CLEANUP_ARMED == 'true'
        run: npm run acceptance:synthetic:residue
      - name: Generate final release-truth report
        if: always()
        run: npm run acceptance:report:final
      - name: Remove temporary browser credentials
        if: always()
        shell: bash
        run: |
          if [ -n "${ACCEPTANCE_CREDENTIAL_BUNDLE_PATH:-}" ]; then
            rm -f -- "$ACCEPTANCE_CREDENTIAL_BUNDLE_PATH"
          fi
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authenticated-acceptance-sanitized-${{ github.run_id }}
          path: |
            artifacts/authenticated-acceptance-report.json
            acceptance-evidence/*.png
          if-no-files-found: error
          retention-days: 7
