name: Production Trust Foundation CI

on:
  push:
    branches:
      - "codex/precision-*"
      - "codex/production-trust-*"
      - "codex/recruiter-api-authorization-*"
      - "codex/dependency-security-*"
      - "codex/authenticated-acceptance-*"
      - "codex/acceptance-workflow-*"
  pull_request:
    branches:
      - "codex/profile-source-recovery"
      - "codex/production-trust-*"
      - "codex/recruiter-api-authorization-*"
      - "codex/dependency-security-*"
      - "codex/authenticated-acceptance-*"
      - "codex/acceptance-workflow-*"
      - "release/**"
      - integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: High-severity dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Clean dependency installation
        run: npm ci --ignore-scripts

      - name: Reject high or critical dependency findings
        run: npm audit --audit-level=high

      - name: Require explicit treatment through moderate severity
        run: npm audit --audit-level=moderate

      - name: Verify lockfile and generate license inventory
        run: npm run audit:production-trust:supply-chain

      - name: Verify production CycloneDX SBOM
        shell: bash
        run: test -s artifacts/production-sbom.cdx.json

      - name: Upload sanitized supply-chain evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-trust-supply-chain-${{ github.sha }}
          path: |
            artifacts/production-trust-supply-chain.json
            artifacts/production-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject unauthorized vulnerable or restrictive dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  secret-history:
    name: Current tree and complete history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan committed content without external verification
        shell: bash
        run: >-
          docker run --rm -v $PWD:/tmp -w /tmp
          ghcr.io/trufflesecurity/trufflehog:3.97.4 git file:///tmp
          --since-commit=300b6a1b03921a2d4710a2585c62bebc69d55831
          --branch=${{ github.sha }} --no-verification --fail --no-update
          --exclude-paths=.trufflehog-history-exclude.txt

      - name: Scan the current committed tree
        shell: bash
        run: >-
          docker run --rm -v "$PWD:/tmp" -w /tmp
          ghcr.io/trufflesecurity/trufflehog:3.97.4 filesystem /tmp
          --no-verification --fail --no-update
          --exclude-paths=.trufflehog-current-exclude.txt

  security-and-regression:
    name: Security and deterministic regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: test
      AUTH_MODE: disabled
      EXTERNAL_TALENT_SEARCH_ENABLED: "false"
      EXTERNAL_TALENT_PROVIDER: disabled
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Clean dependency installation
        run: npm ci

      - name: Reject mutable GitHub Action references
        run: npm run test:github-actions-pinning

      - name: Route policy and authorization matrix
        run: npm run test:production-trust:authorization

      - name: Authenticated acceptance harness safety contracts
        run: npm run test:acceptance:harness

      - name: Search authorization, cache scope, and candidate privacy
        run: npm run test:production-trust:search-security

      - name: Internal and external Search V2 regressions
        run: npm run test:production-trust:search-regression

      - name: Canonical evidence and immutable golden regressions
        run: npm run test:production-trust:canonical

      - name: CV source layout and complete-document OCR regressions
        run: |
          node --import tsx scripts/candidateSourcePreservation.test.ts
          node --import tsx scripts/pdfTextLayout.test.ts
          node --import tsx scripts/docxTextLayout.test.ts
          node --import tsx scripts/layoutEmployment.test.ts
          node --import tsx scripts/dateCompanyRoleEmployment.test.ts
          node --import tsx scripts/employmentTableDateLayouts.test.ts
          node --import tsx scripts/careerDateConsistency.test.ts
          node --import tsx scripts/careerOwnershipQuality.test.ts
          node --import tsx scripts/labelledClientEmployerEmployment.test.ts
          node --import tsx scripts/headedChronologicalEmployment.test.ts
          node --import tsx scripts/headedCareerCards.test.ts
          node --import tsx scripts/boundedCareerSummary.test.ts
          node --import tsx scripts/boundedEmployerRoleCards.test.ts
          node --import tsx scripts/boundedEmploymentFieldCards.test.ts
          node --import tsx scripts/employmentEvidenceDeduplication.test.ts
          node --import tsx scripts/profileSourceAuditEvidence.test.ts
          node --import tsx scripts/flattenedEmployment.test.ts
          node --import tsx scripts/exportedCareerEmployment.test.ts
          node --import tsx scripts/anchoredEmployment.test.ts
          node --import tsx scripts/boundedEmploymentBatch.test.ts
          node --import tsx scripts/delimitedEmploymentBatch.test.ts
          node --import tsx scripts/careerHeadingBatch.test.ts
          node --import tsx scripts/labelledCareerBatch.test.ts
          node --import tsx scripts/interleavedCareerBatch.test.ts
          node --import tsx scripts/careerLedgerBatch.test.ts
          node --import tsx scripts/labelledCareerRecords.test.ts
          node --import tsx scripts/numericContractCareer.test.ts
          node --import tsx scripts/nativeProjectCards.test.ts
          node --import tsx scripts/employerPromotionSpells.test.ts
          node --import tsx scripts/explicitEmployerFieldFamilies.test.ts
          node --import tsx scripts/originalCareerLayouts.test.ts
          node --import tsx scripts/threeTierRecovery.test.ts
          node --import tsx scripts/candidateSecurityFixtureRls.test.ts
          node --import tsx scripts/candidateDetailAuthorization.test.ts
          node --import tsx scripts/cvPdfOcr.test.ts
          node --import tsx scripts/uploadCvSourceFailure.test.ts

      - name: Spreadsheet export and lazy-client regressions
        run: npm run test:production-trust:dependencies

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Scoped formatting check
        run: |
          npm run check:production-trust:format
          npm run check:acceptance:format

      - name: Commit whitespace check
        shell: bash
        run: git diff --check HEAD^ HEAD

      - name: Generate sanitized CI evidence
        run: npm run audit:production-trust:ci

      - name: Upload sanitized security summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-trust-sanitized-summary-${{ github.sha }}
          path: artifacts/production-trust-ci-summary.json
          if-no-files-found: error
          retention-days: 7

  production-build:
    name: Webpack production build and client secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security-and-regression
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: test
      AUTH_MODE: disabled
      EXTERNAL_TALENT_SEARCH_ENABLED: "false"
      EXTERNAL_TALENT_PROVIDER: disabled
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Clean dependency installation
        run: npm ci

      - name: Next.js 16.3.5 Webpack production build
        run: npm run build:webpack

      - name: Scan client bundle for server secret material
        run: npm run scan:production-trust:bundle

      - name: Upload sanitized build security summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-trust-build-summary-${{ github.sha }}
          path: artifacts/production-trust-client-bundle-scan.json
          if-no-files-found: error
          retention-days: 7
